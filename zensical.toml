[project]
site_name = "Customized WhisperCPP | Scientific documentation"
site_description = "Error-adaptive speech transcription methods and evidence limitations."
site_url = "https://Mihails-Birjukovs.github.io/Customized_WhisperCPP/"
docs_dir = "site_docs"
site_dir = "site"
repo_url = "https://github.com/Mihails-Birjukovs/Customized_WhisperCPP"
repo_name = "Mihails-Birjukovs/Customized_WhisperCPP"
extra_css = ["stylesheets/inm-documentation-v1.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js",
]
nav = [
  { "Overview" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Architecture" = "architecture.md" },
  { "Adaptive recovery" = "adaptive-recovery.md" },
  { "Validation" = "validation.md" },
  { "Provenance" = "provenance.md" },
  { "Roadmap" = "roadmap.md" },
  { "Credits and licensing" = "credits.md" },
]
[project.theme]
logo = "assets/inm-horizontal.svg"
favicon = "assets/inm-mark.svg"
language = "en"
features = [
 "navigation.instant", "navigation.tracking", "navigation.tabs", "navigation.sections",
 "toc.follow", "navigation.footer", "navigation.top",
 "search.highlight", "content.code.copy"
]

[project.markdown_extensions]
pymdownx.arithmatex.generic = true
