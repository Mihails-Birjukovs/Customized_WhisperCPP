name: Phase 0 legacy integrity
on:
  pull_request:
    paths:
      - 'legacy/**'
      - 'configs/**'
      - 'tests/phase0/**'
      - '.github/workflows/phase0-integrity.yml'
  push:
    paths:
      - 'legacy/**'
      - 'configs/**'
      - 'tests/phase0/**'
      - '.github/workflows/phase0-integrity.yml'
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/phase0 -v
